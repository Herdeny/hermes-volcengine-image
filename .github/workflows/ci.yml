name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # The plugin imports Hermes core modules (agent.image_gen_provider,
      # agent.secret_scope). Clone the Hermes agent repo so those imports
      # resolve, mirroring how the plugin runs inside a real Hermes install.
      - name: Fetch Hermes core for imports
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent

      - name: Run tests
        run: |
          export PYTHONPATH=/tmp/hermes-agent:$PYTHONPATH
          python -m unittest discover -s tests -v

      - name: Syntax check
        run: |
          python -m py_compile plugins/image_gen/volcengine/__init__.py
          python -m py_compile tests/test_volcengine.py
